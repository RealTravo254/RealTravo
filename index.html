<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
      
    <!-- Dynamic status bar colors based on user system preference -->
    <meta name="theme-color" content="#008080" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1a2332" media="(prefers-color-scheme: dark)" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Real Travo" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="google-site-verification" content="-gW4v5AAxn1KmeJkWDH03jKAa1jPsQXwxBSh9CYLkJw" />
    <title>Real Travo - Hotels, Airbnb, Campsites & Accommodation Bookings</title>
    <meta name="description" content="Discover and book campsites, and trip and giuded tours with Real Travo. Explore campsite activities and facilities for unforgettable experiences." />
    <meta name="keywords" content="Real Travo, campsite booking and outdoor experieces" />
    
    <link rel="preload" as="image" href="/fulllogo.png" fetchpriority="high" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://lmkxpzemfvmffxppxzky.supabase.co" crossorigin />

    <meta property="og:title" content="| Outdoor | Campsites | Guided tours" />
    <meta property="og:description" content="Explore amazing experiences campsites, and outdoor experiences with Real Travo." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://realtravo.com/" />
    <meta property="og:image" content="https://realtravo.com/fulllogo.png" />

    <style>
      :root {
        --safe-bar-bg: #008080;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --safe-bar-bg: #1a2332;
        }
      }

      html {
        background-color: var(--safe-bar-bg);
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f4f7f6;
      }

      #root {
        min-height: 100vh;
      }

      /*
       * Safe-area bars (notch / status bar / home indicator strips).
       * Dynamic background color based on system light/dark theme preference.
       */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top, 0px);
        background-color: var(--safe-bar-bg);
        z-index: 99999;
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-bottom, 0px);
        background-color: var(--safe-bar-bg);
        z-index: 99999;
        pointer-events: none;
      }

      .glass-effect {
        background-color: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      #splash {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #f4f7f6;
      }

      #splash-brand {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: clamp(12px, 3vh, 28px);
        height: 60vh;
        max-height: 60vh;
        opacity: 0;
        transition: opacity 0.2s ease;
      }

      #splash-brand.is-ready {
        opacity: 1;
      }

      #splash-logo-img {
        width: auto;
        height: 60%;
        max-width: 60vw;
        object-fit: contain;
      }

      #splash-logo {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: clamp(2rem, 8vw, 4rem);
        font-weight: 700;
        letter-spacing: -0.5px;
        line-height: 1;
        white-space: nowrap;
      }

      #splash-logo .real {
        color: #0d2b4e;
      }

      #splash-logo .travo {
        color: #008080;
      }
    </style>
  </head>

  <body>
    <header class="sr-only">
      <h1>Real Travo - Book fro Outdoor Campsites & Activities, Get a guide please</h1>
      <nav>
        <a href="https://realtravo.com/category/campsites">Campsites</a>
        <a href="https://realtravo.com/category/guided">Trip and guided tours</a>
      </nav>
    </header>

    <div id="root">
      <div id="splash">
        <div id="splash-brand">
          <img
            id="splash-logo-img"
            src="/fulllogo.png"
            alt="Real Travo"
            fetchpriority="high"
            decoding="sync"
            onload="var __b=document.getElementById('splash-brand'); if (__b) __b.classList.add('is-ready')"
          />
          <span id="splash-logo">
            <span class="real">Real</span><span class="travo">Travo</span>
          </span>
        </div>
      </div>
      <script>
        (function () {
          var img = document.getElementById('splash-logo-img');
          var brand = document.getElementById('splash-brand');
          if (img && img.complete) {
            brand.classList.add('is-ready');
          }
          if (img) {
            img.addEventListener('error', function () {
              brand.classList.add('is-ready');
            });
          }
          setTimeout(function () {
            if (brand) brand.classList.add('is-ready');
          }, 1500);
        })();
      </script>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
