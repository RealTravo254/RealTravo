<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
     
    <meta name="theme-color" content="#008080" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Real Travo" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="google-site-verification" content="-gW4v5AAxn1KmeJkWDH03jKAa1jPsQXwxBSh9CYLkJw" />
    <title>Real Travo - Hotels, Airbnb, Campsites & Accommodation Bookings</title>
    <meta name="description" content="Discover and book hotels, Airbnb stays, campsites, and accommodation with Real Travo. Explore campsite activities and hotel facilities for unforgettable stays." />
    <meta name="keywords" content="Real Travo, hotel booking, Airbnb, campsite booking, accommodation, campsite activities, hotel facilities" />
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://lmkxpzemfvmffxppxzky.supabase.co" crossorigin />

    <meta property="og:title" content="Hotels | Airbnb | Campsites | Accommodation" />
    <meta property="og:description" content="Explore amazing hotels, Airbnb stays, campsites, and accommodation with Real Travo." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://realtravo.com/" />
    <meta property="og:image" content="https://realtravo.com/fulllogo.png" />

    <style>
      html {
        background-color: #008080;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f4f7f6;
      }

      #root {
        min-height: 100vh;
      }

      /*
       * Safe-area bars (notch / status bar / home indicator strips).
       * These are the ONLY elements allowed to react to the system's
       * light/dark color scheme — everything else on the page stays
       * fixed regardless of prefers-color-scheme.
       */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top, 0px);
        background-color: #008080;
        z-index: 99999;
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-bottom, 0px);
        background-color: #008080;
        z-index: 99999;
        pointer-events: none;
      }

      @media (prefers-color-scheme: dark) {
        /* Safe-area bars only — do not add any other selectors here. */
        body::before,
        body::after {
          background-color: #1a2332;
        }
      }

      .glass-effect {
        background-color: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }

      #splash {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100vh;
        background-color: #f4f7f6;
      }

      #splash-logo {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 2.6rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        line-height: 1;
      }

      #splash-logo .real {
        color: #0d2b4e;
      }

      #splash-logo .travo {
        color: #008080;
      }
    </style>
  </head>

  <body>
    <header class="sr-only">
      <h1>Real Travo - Book Hotels, Airbnb, Campsites & Accommodation</h1>
      <nav>
        <a href="https://realtravo.com/category/hotels">Hotels</a>
        <a href="https://realtravo.com/category/airbnb">Airbnb</a>
        <a href="https://realtravo.com/category/campsites">Campsites</a>
        <a href="https://realtravo.com/category/accommodation">Accommodation</a>
      </nav>
    </header>

    <div id="root">
      <div id="splash">
        <span id="splash-logo">
          <span class="real">Real</span><span class="travo"> Travo</span>
        </span>
      </div>
    </div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
