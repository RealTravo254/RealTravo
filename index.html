<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
     
    <meta name="theme-color" content="#008080" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Realtravo" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="google-site-verification" content="-gW4v5AAxn1KmeJkWDH03jKAa1jPsQXwxBSh9CYLkJw" />
    <title>Realtravo - Where Every Journey Begins with a Better Booking</title>
    <meta name="description" content="Discover and book exciting trips, events, and hotels with Realtravo. Your gateway to unforgettable travel experiences." />
    <meta name="keywords" content="Realtravo, Real Travo, travel booking, book hotels, travel experiences, adventure trips, become a host" />
    
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://lmkxpzemfvmffxppxzky.supabase.co" crossorigin />

    <meta property="og:title" content="Realtravo - Click. Pack. Go!" />
    <meta property="og:description" content="Explore amazing travel experiences, hotels, and adventures with Realtravo." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://realtravo.com/" />
    <meta property="og:image" content="https://realtravo.com/fulllogo.png" />

    <style>
      /* Teal (#008080) safe-zone fills for status bar and home indicator */
      html {
        background-color: #008080;
      }

      body {
        margin: 0;
        font-family: system-ui, -apple-system, sans-serif;
        background-color: #f4f7f6;
      }

      #root {
        min-height: 100vh;
      }

      /* Status bar safe zone — teal strip at top */
      body::before {
        content: "";
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top, 0px);
        background-color: #008080;
        z-index: 99999;
        pointer-events: none;
      }

      /* Home indicator safe zone — teal strip at bottom */
      body::after {
        content: "";
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-bottom, 0px);
        background-color: #008080;
        z-index: 99999;
        pointer-events: none;
      }

      .glass-effect {
        background-color: rgba(255, 255, 255, 0.5);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      }

      @media (prefers-color-scheme: dark) {
        body { background-color: #1a2332; }
        .glass-effect {
          background-color: rgba(26, 35, 50, 0.7);
          border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border-width: 0;
      }
    </style>
  </head>

  <body>
    <header class="sr-only">
      <h1>Realtravo - Book Trips, Events, Sports, Hotels & Adventures</h1>
      <nav>
        <a href="https://realtravo.com/category/trips">Trips</a>
        <a href="https://realtravo.com/category/adventures">Adventure Places</a>
        <a href="https://realtravo.com/category/events">Events & Sports</a>
      </nav>
    </header>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
